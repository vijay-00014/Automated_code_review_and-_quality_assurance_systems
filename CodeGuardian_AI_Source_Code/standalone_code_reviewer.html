<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeGuardian AI - Single File Automated Code Reviewer</title>

  <!-- Google Fonts & Tailwind CDN -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #080c14;
      --bg-card: rgba(17, 24, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --critical: #f43f5e;
      --critical-bg: rgba(244, 63, 94, 0.15);
      --major: #f59e0b;
      --major-bg: rgba(245, 158, 11, 0.15);
      --minor: #eab308;
      --minor-bg: rgba(234, 179, 8, 0.12);
      --info: #3b82f6;
      --info-bg: rgba(59, 130, 246, 0.15);
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    body {
      background-color: var(--bg-dark);
      color: #f3f4f6;
      font-family: var(--font-sans);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-critical { background: var(--critical-bg); color: var(--critical); border: 1px solid rgba(244, 63, 94, 0.4); }
    .badge-major { background: var(--major-bg); color: var(--major); border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-minor { background: var(--minor-bg); color: var(--minor); border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge-info { background: var(--info-bg); color: var(--info); border: 1px solid rgba(59, 130, 246, 0.3); }

    .diff-line.added { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .diff-line.removed { background: rgba(244, 63, 94, 0.15); color: #fda4af; }
    .diff-line.normal { color: #9ca3af; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Single File Bundle React Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ----------------------------------------------------
    // 1. SAMPLE CODE PRESETS
    // ----------------------------------------------------
    const SAMPLE_PRESETS = [
      {
        id: 'python-security-sql',
        name: 'Python Flask API (Security & SQL Injection)',
        language: 'python',
        icon: '🐍',
        description: 'Contains OWASP Top 10 SQL Injection, hardcoded JWT secrets, and eval() execution.',
        code: `import sqlite3
import jwt
from flask import Flask, request, jsonify

app = Flask(__name__)
SECRET_KEY = "super_secret_jwt_key_12345!" # Hardcoded API Secret!

@app.route('/user/login', methods=['POST'])
def login():
    data = request.get_json()
    username = data['username']
    password = data['password']
    
    # DANGER: SQL Injection vulnerability!
    query = "SELECT * FROM users WHERE username = '" + username + "' AND password = '" + password + "'"
    
    conn = sqlite3.connect('database.db')
    cursor = conn.cursor()
    cursor.execute(query) # Unsafe execution!
    user = cursor.fetchone()
    
    if user:
        token = jwt.encode({"user_id": user[0]}, SECRET_KEY, algorithm="HS256")
        return jsonify({"status": "success", "token": token})
    return jsonify({"status": "error"}), 401

@app.route('/debug/eval', methods=['GET'])
def debug_code():
    code = request.args.get('cmd')
    # CRITICAL: Remote Code Execution!
    result = eval(code)
    return str(result)`
      },
      {
        id: 'nodejs-async-memory',
        name: 'Node.js Express (Async Leak & Performance)',
        language: 'javascript',
        icon: '🟨',
        description: 'Includes unhandled promise rejections, blocking O(n^2) loops, and memory listener leaks.',
        code: `const express = require('express');
const EventEmitter = require('events');
const app = express();
const eventBus = new EventEmitter();

let globalCache = [];

app.post('/process-items', async (req, res) => {
  const items = req.body.items || [];
  
  // Unhandled async promise rejection risk
  fetchExternalAnalytics(req.body.userId);
  
  const duplicateMatrix = [];
  // O(n^2) nested loop blocking the event loop
  for (let i = 0; i < items.length; i++) {
    for (let j = 0; j < items.length; j++) {
      if (i !== j && items[i].id === items[j].id) {
        duplicateMatrix.push([items[i], items[j]]);
      }
    }
  }

  // Memory Leak: Adding event listener on every HTTP request!
  eventBus.on('dataProcessed', (data) => {
    globalCache.push(data);
  });
  
  res.json({ status: 'done', duplicates: duplicateMatrix.length });
});`
      }
    ];

    // ----------------------------------------------------
    // 2. STATIC ANALYSIS ENGINE
    // ----------------------------------------------------
    function runStaticAnalysis(code, language = 'javascript') {
      if (!code) return [];
      const lines = code.split('\n');
      const staticIssues = [];

      lines.forEach((line, index) => {
        const lineNumber = index + 1;
        const trimmed = line.trim();

        if (/(api[_-]?key|secret[_-]?key|jwt[_-]?secret|password)\s*[:=]\s*["'][A-Za-z0-9_\-!@#$%^&*]{8,}["']/i.test(trimmed)) {
          staticIssues.push({
            line: lineNumber,
            severity: 'critical',
            category: 'Security',
            title: 'Hardcoded Credential or Secret Detected',
            description: 'Hardcoding credentials in source code creates high risk of security leaks.',
            recommendation: 'Move secret into environment variables (e.g. process.env or os.environ).',
            codeSnippet: trimmed
          });
        }

        if (/(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE)\s+.*(\+|=|\$|\.format\().*/i.test(trimmed) && !trimmed.includes('?')) {
          staticIssues.push({
            line: lineNumber,
            severity: 'critical',
            category: 'Security',
            title: 'Potential SQL Injection Vulnerability',
            description: 'Constructing SQL query with string concatenation allows untrusted SQL execution.',
            recommendation: 'Use parameterized queries or prepared statements.',
            codeSnippet: trimmed
          });
        }

        if (/\b(eval|exec)\s*\(/.test(trimmed)) {
          staticIssues.push({
            line: lineNumber,
            severity: 'critical',
            category: 'Security',
            title: 'Dangerous Dynamic Code Execution (eval/exec)',
            description: 'Dynamic code execution allows arbitrary Remote Code Execution (RCE).',
            recommendation: 'Remove eval() dynamic execution completely.',
            codeSnippet: trimmed
          });
        }

        if (/for\s*\(.*for\s*\(/.test(trimmed)) {
          staticIssues.push({
            line: lineNumber,
            severity: 'major',
            category: 'Performance',
            title: 'Nested Loop Detected (Quadratic Complexity O(n²))',
            description: 'Nested iterations degrade performance on dynamic datasets.',
            recommendation: 'Refactor using HashMap/Set lookups for linear O(n) performance.',
            codeSnippet: trimmed
          });
        }
      });

      return staticIssues;
    }

    // ----------------------------------------------------
    // 3. HEURISTIC REVIEW ENGINE
    // ----------------------------------------------------
    function reviewCodeHeuristically(code, language = 'javascript') {
      if (!code) return { overallScore: 100, grade: 'A+', issues: [], refactoredCode: '' };

      const staticIssues = runStaticAnalysis(code, language);
      const criticalCount = staticIssues.filter(i => i.severity === 'critical').length;
      const majorCount = staticIssues.filter(i => i.severity === 'major').length;
      const penalty = (criticalCount * 25) + (majorCount * 12);
      const overallScore = Math.max(15, Math.min(100, 100 - penalty));

      let grade = 'A+';
      if (overallScore < 50) grade = 'F';
      else if (overallScore < 70) grade = 'C';
      else if (overallScore < 90) grade = 'B';

      let refactoredCode = code;
      if (code.includes('query = "SELECT * FROM users WHERE username =')) {
        refactoredCode = refactoredCode.replace(/query = "SELECT \* FROM users WHERE username = '.*/g, `# FIXED: Parameterized query binding\n    query = "SELECT id, username FROM users WHERE username = ? AND password = ?"\n    cursor.execute(query, (username, password))`);
        refactoredCode = refactoredCode.replace(/SECRET_KEY = ".*"/g, 'SECRET_KEY = os.environ.get("JWT_SECRET_KEY")');
        refactoredCode = refactoredCode.replace(/result = eval\(code\)/g, '# REPLACED: eval() removed\n    result = safe_command_runner(code)');
      }

      return {
        timestamp: new Date().toISOString(),
        overallScore,
        grade,
        metrics: {
          securityScore: Math.max(10, 100 - (criticalCount * 35)),
          performanceScore: Math.max(20, 100 - (majorCount * 25)),
          maintainabilityScore: Math.max(30, 100 - (staticIssues.length * 10))
        },
        counts: { total: staticIssues.length, critical: criticalCount, major: majorCount },
        issues: staticIssues,
        refactoredCode,
        summaryText: `Analysis complete with Grade ${grade} (${staticIssues.length} issues identified).`
      };
    }

    // ----------------------------------------------------
    // 4. MAIN APP COMPONENT
    // ----------------------------------------------------
    function App() {
      const [code, setCode] = useState(SAMPLE_PRESETS[0].code);
      const [language, setLanguage] = useState(SAMPLE_PRESETS[0].language);
      const [reviewData, setReviewData] = useState(null);
      const [activeTab, setActiveTab] = useState('annotations');

      useEffect(() => {
        handleReview();
      }, []);

      const handleReview = () => {
        const result = reviewCodeHeuristically(code, language);
        setReviewData(result);
      };

      const handleApplyFix = () => {
        if (reviewData && reviewData.refactoredCode) {
          setCode(reviewData.refactoredCode);
          setTimeout(() => {
            setReviewData(reviewCodeHeuristically(reviewData.refactoredCode, language));
          }, 100);
        }
      };

      return (
        <div className="max-w-7xl mx-auto p-6 space-y-6">
          {/* Header */}
          <header className="glass-panel flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white text-xl">
                🛡️
              </div>
              <div>
                <h1 className="text-xl font-bold text-white">CodeGuardian AI</h1>
                <span className="text-xs text-gray-400">Single-File Automated Code Reviewer</span>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <select
                className="bg-slate-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-200 outline-none"
                onChange={(e) => {
                  const preset = SAMPLE_PRESETS.find(p => p.id === e.target.value);
                  if (preset) { setCode(preset.code); setLanguage(preset.language); }
                }}
              >
                {SAMPLE_PRESETS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>

              <button
                onClick={handleReview}
                className="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-sm px-5 py-2 rounded-xl shadow-lg transition"
              >
                ▶ Run Review
              </button>
            </div>
          </header>

          {/* Main Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Code Editor Left */}
            <div className="glass-panel flex flex-col space-y-3">
              <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                <span className="font-semibold text-sm text-gray-300">Code Editor</span>
                <span className="text-xs text-gray-500">Lines: {code.split('\n').length}</span>
              </div>
              <textarea
                className="w-full h-[450px] bg-slate-950 text-gray-200 font-mono text-sm p-4 rounded-xl border border-gray-800 outline-none resize-none"
                value={code}
                onChange={(e) => setCode(e.target.value)}
                spellCheck="false"
              />
            </div>

            {/* Dashboard & Review Output Right */}
            <div className="space-y-6">
              {reviewData && (
                <div className="glass-panel space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-3xl font-extrabold text-indigo-400">{reviewData.overallScore} / 100</div>
                      <div className="text-sm font-semibold text-gray-400">Quality Grade: {reviewData.grade}</div>
                    </div>
                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${reviewData.overallScore >= 80 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}`}>
                      {reviewData.overallScore >= 80 ? 'PASSED' : 'ACTION REQUIRED'}
                    </span>
                  </div>

                  {/* Tabs */}
                  <div className="flex border-b border-gray-800 gap-2">
                    <button
                      className={`px-4 py-2 text-sm font-semibold rounded-t-lg ${activeTab === 'annotations' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}
                      onClick={() => setActiveTab('annotations')}
                    >
                      Annotated Code ({reviewData.issues.length})
                    </button>
                    <button
                      className={`px-4 py-2 text-sm font-semibold rounded-t-lg ${activeTab === 'diff' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}
                      onClick={() => setActiveTab('diff')}
                    >
                      Refactoring Diff
                    </button>
                  </div>

                  {/* Annotations Tab */}
                  {activeTab === 'annotations' && (
                    <div className="space-y-3 max-h-[350px] overflow-y-auto pr-2">
                      {reviewData.issues.map((issue, idx) => (
                        <div key={idx} className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 space-y-1">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-bold text-rose-400 uppercase">Line {issue.line} • {issue.severity}</span>
                            <span className="text-gray-400">{issue.category}</span>
                          </div>
                          <div className="font-semibold text-white text-sm">{issue.title}</div>
                          <div className="text-xs text-gray-300">{issue.description}</div>
                          <div className="text-xs text-emerald-400 font-mono mt-1">💡 Fix: {issue.recommendation}</div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Diff Tab */}
                  {activeTab === 'diff' && (
                    <div className="space-y-3">
                      <div className="flex justify-end">
                        <button
                          onClick={handleApplyFix}
                          className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg shadow"
                        >
                          ✨ Apply Suggested Fix
                        </button>
                      </div>
                      <pre className="bg-slate-950 p-4 rounded-xl text-xs font-mono text-gray-300 max-h-[300px] overflow-y-auto border border-gray-800 whitespace-pre-wrap">
                        {reviewData.refactoredCode}
                      </pre>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
